# ═══════════════════════════════════════════════════════════════════════════
#  THE SINGLE SOURCE OF TRUTH
#
#  Every address, phone number, email, office hour, fee and external link the
#  website displays comes from this file. Change a value here and it changes
#  everywhere it appears.
#
#  Edited through the web at /admin/ → "Site Settings".
#
#  Do NOT copy any of these values into hugo.toml or into page text. The build
#  will fail if contact fields reappear under [params], and prose should use
#  the {{< org >}} and {{< email >}} shortcodes instead of typing values.
# ═══════════════════════════════════════════════════════════════════════════

