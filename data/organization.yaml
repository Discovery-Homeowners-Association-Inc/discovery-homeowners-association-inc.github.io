# ─── EXTERNAL SERVICES ─────────────────────────────────────────────────────
#  Entries marked `is_placeholder: true` show a warning banner during local
#  development until a real URL is filled in. See _partials/dev/placeholders.html
external:
  payhoa:
    # The association has partnered with PayHOA for the homeowner portal.
    # Details below are taken from the association's own rollout flyer.
    # PayHOA uses one shared login for every association — residents register
    # with their email and the office approves the request, so there is no
    # association-specific subdomain to configure.
    enabled: true
    is_placeholder: false
    label: "Pay Dues"
    portal_label: "Resident Portal"
    portal_url: "https://app.payhoa.com/auth/login"
    pay_url: "https://app.payhoa.com/auth/login"
    signup_url: "https://app.payhoa.com/auth/login"
    help_text: "Pay your assessment, see your balance, get documents, and submit ACC applications."
    # What residents can do once they are in
    features:
      - "Pay your assessment online"
      - "Get association documents"
      - "Submit an Architectural Control (ACC) application"
      - "Send a question to the office"
      - "Report a maintenance concern"
      - "Receive assessment invoices by email instead of by mail"
    # How to get an account
    registration_steps:
      - "Go to payhoa.com and click Login."
      - "Enter your email address."
      - "Confirm your name and property address."
      - "Your request goes to the HOA office for approval."
      - "Once approved, create a password and sign in."
    # Processing fees are charged by PayHOA, not by the association
    fees:
      - method: "Bank account (ACH)"
        amount: "$2.45 per transaction"
      - method: "Credit card"
        amount: "3.5% + $0.50 per transaction"
    fees_note: "These processing fees are charged by PayHOA, not by the association."
    offline_note: "The office still accepts cash, check, and bank bill-pay."

  governing_documents:
    # DISABLED until there is somewhere public to point at.
    #
    # The governing-documents repository is PRIVATE, so linking to it gave every
    # resident a GitHub 404. The link check caught this. Re-enable once either
    # the repository is made public or its MkDocs site is published to Pages —
    # then set enabled:true and put the real URL here.
    enabled: false
    is_placeholder: true
    label: "Governing Documents"
    url: "https://github.com/Discovery-Homeowners-Association-Inc/governing-documents"
    note: "By-Laws, Declaration of Covenants, and Articles of Incorporation."

  pool_registration:
    is_placeholder: false
    label: "Register for a pool pass"
    url: "https://swimmingpoolpasses.net/discovery-community-pool/"
    vendor: "Access Granted Systems"

  county_recycling:
    is_placeholder: false
    label: "Frederick County collection schedule"
    url: "https://frederickcountymd.gov/3447/Curbside-Collection-Schedule"

  water_bill:
    is_placeholder: false
    label: "Pay your Walkersville water bill"
    url: "https://www.walkersvillemd.gov/"
