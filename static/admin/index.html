<!--
  Sveltia CMS.

  The version is PINNED and carries a Subresource Integrity hash. This script
  is granted write access to the repository through the visitor's GitHub
  account, so a floating tag would mean trusting whatever the CDN serves on any
  given day. With an exact version plus `integrity`, the browser refuses to run
  the file at all if a single byte differs from what was reviewed.

  To upgrade:
    1. Pick the new version from https://github.com/sveltia/sveltia-cms/releases
    2. curl -sL https://unpkg.com/@sveltia/cms@VERSION/dist/sveltia-cms.js \
         | openssl dgst -sha384 -binary | openssl base64 -A
    3. Update both the src and the integrity value below
    4. Open /admin/ and confirm it still loads before committing

  Do not add type="module" — Sveltia ships a classic script.
-->
<script
  src="https://unpkg.com/@sveltia/cms@0.184.0/dist/sveltia-cms.js"
  integrity="sha384-W96F8GbLvK7rvt7jPP2OpJfdJQ7gMkMjvhkrXYbwRIGPfpBPfZmYUdlZ7EKF178E"
  crossorigin="anonymous"></script>
