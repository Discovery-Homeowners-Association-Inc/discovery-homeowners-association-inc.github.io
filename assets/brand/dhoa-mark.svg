<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 66" class="mark"
     role="img" aria-label="Discovery Homeowners Association">
  <!--
    The association's own mark, redrawn as vector art.

    The only surviving copy was the letterhead on a scanned fax-quality PDF
    (an RV lot notice), so this is a faithful redraw rather than a trace of the
    scan: a sun rising behind a ridge of farmland, with an orchard tree below.
    Apt for a neighborhood built on 160 acres of former farm in 1972.

    Drawn with currentColor so it inherits whatever colour it is placed on and
    works in both light and dark themes.
  -->
  <g fill="none" stroke="currentColor" stroke-width="2.4"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- Frame -->
    <rect x="1.6" y="1.6" width="56.8" height="62.8" rx="5"/>

    <!-- Sun, rising behind the ridge -->
    <circle cx="30" cy="21" r="5.4" stroke-width="2"/>

    <!-- The ridge: two lines meeting at a shallow peak, as on the original -->
    <path d="M4 34 Q 30 24 56 33" stroke-width="2"/>
    <path d="M4 41 Q 30 31 56 40" stroke-width="2"/>
  </g>

  <!-- Field texture between the ridge lines. Hidden at small sizes (see
       .mark--compact) where these dots read as dirt on the screen rather
       than as a ploughed field. -->
  <g class="mark__texture" fill="currentColor" opacity="0.55">
    <circle cx="10" cy="36.6" r="0.75"/><circle cx="15" cy="35.3" r="0.75"/>
    <circle cx="20" cy="34.2" r="0.75"/><circle cx="25" cy="33.4" r="0.75"/>
    <circle cx="30" cy="33.1" r="0.75"/><circle cx="35" cy="33.4" r="0.75"/>
    <circle cx="40" cy="34.1" r="0.75"/><circle cx="45" cy="35.1" r="0.75"/>
    <circle cx="50" cy="36.3" r="0.75"/>
    <circle cx="12.5" cy="39.2" r="0.75"/><circle cx="17.5" cy="37.9" r="0.75"/>
    <circle cx="22.5" cy="36.9" r="0.75"/><circle cx="27.5" cy="36.3" r="0.75"/>
    <circle cx="32.5" cy="36.3" r="0.75"/><circle cx="37.5" cy="36.8" r="0.75"/>
    <circle cx="42.5" cy="37.6" r="0.75"/><circle cx="47.5" cy="38.7" r="0.75"/>
  </g>

  <!-- Tree: trunk, two branches, and the fruit -->
  <g fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 60 V 42"/>
    <path d="M30 50 l -5 -4"/>
    <path d="M30 53 l 5 -4"/>
  </g>

  <g fill="currentColor">
    <circle cx="30" cy="41" r="2.6"/>
    <circle cx="23" cy="45" r="2.6"/><circle cx="37" cy="45" r="2.6"/>
    <circle cx="18" cy="50" r="2.6"/><circle cx="42" cy="50" r="2.6"/>
    <circle cx="25" cy="51" r="2.6"/><circle cx="35" cy="51" r="2.6"/>
    <circle cx="20" cy="56" r="2.6"/><circle cx="40" cy="56" r="2.6"/>
    <circle cx="27" cy="57" r="2.6"/><circle cx="33" cy="57" r="2.6"/>
  </g>
</svg>
